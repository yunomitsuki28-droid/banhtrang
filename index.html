  <body class="bg-[#181920] text-[#F8FAFC] overflow-hidden select-none touch-none">
    <div id="root"></div>
    <script>
      (function lockMobileViewport() {
        var isScrollableModal = function (target) {
          if (!target || typeof target.closest !== 'function') return false;
          var el = target.closest('.allow-touch-scroll');
          return !!(el && el.scrollHeight > el.clientHeight);
        };

        var isInteractiveUiControl = function (target) {
          if (!target || typeof target.closest !== 'function') return false;
          return !!target.closest('button, a, input, select, textarea, [role="button"], [data-allow-touch]');
        };

        // Prevent iOS Safari pull-to-refresh, pinch-zoom, rubber-band scroll, and edge swipe-back
        document.body.addEventListener(
          'touchstart',
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
              return;
            }
            var t = e.touches && e.touches[0];
            if (t && (t.clientX <= 24 || t.clientX >= window.innerWidth - 24)) {
              e.preventDefault();
              return;
            }
            if (e.target && e.target.tagName === 'CANVAS') {
              e.preventDefault();
              return;
            }
            if (!isInteractiveUiControl(e.target) && !isScrollableModal(e.target)) {
              e.preventDefault();
            }
          },
          { passive: false }
        );

        document.body.addEventListener(
          'touchmove',
          function (e) {
            if (e.touches && e.touches.length > 1) {
              e.preventDefault();
              return;
            }
            if (!isScrollableModal(e.target)) {
              e.preventDefault();
            }
          },
          { passive: false }
        );

        // Block iOS Safari proprietary pinch-zoom gestures
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evt) {
          document.addEventListener(
            evt,
            function (e) {
              e.preventDefault();
            },
            { passive: false }
          );
        });

        // Attempt Portrait orientation lock on first interaction when supported
        var tryLockPortrait = function () {
          if (window.screen && window.screen.orientation && typeof window.screen.orientation.lock === 'function') {
            window.screen.orientation.lock('portrait').catch(function () {});
          }
          window.removeEventListener('pointerdown', tryLockPortrait);
          window.removeEventListener('touchstart', tryLockPortrait);
        };
        window.addEventListener('pointerdown', tryLockPortrait, { passive: true });
        window.addEventListener('touchstart', tryLockPortrait, { passive: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
